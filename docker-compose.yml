services:
  mysql:
    image: mysql:8.0
    container_name: canchas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-test_db}
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootchangeme}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: canchas-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-test_db}
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      NODE_ENV: development
      DB_SYNC_ALTER: "true"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
